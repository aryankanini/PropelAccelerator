<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CMS-2567 Compliance Assistant</title>
  <style>
    :root { --ink:#132235; --muted:#51616e; --canvas:#f4f7f7; --surface:#fff; --line:#c8d4d7; --teal:#006b6d; --teal-dark:#004f51; --teal-soft:#d8f0ef; --amber:#7a4300; --amber-soft:#fff1d6; --red:#991b1b; --red-soft:#fde7e7; --space:clamp(16px,3vw,32px); }
    * { box-sizing:border-box; } body { margin:0; color:var(--ink); background:var(--canvas); font:16px/1.55 Georgia,"Times New Roman",serif; } button,input,textarea { font:inherit; } .skip { position:fixed; top:-60px; left:16px; padding:8px 12px; color:#fff; background:var(--ink); z-index:2; } .skip:focus { top:16px; }
    header { background:var(--surface); border-bottom:1px solid var(--line); } .bar,main { width:min(1200px,calc(100% - 32px)); margin:auto; } .bar { display:flex; align-items:center; justify-content:space-between; min-height:76px; gap:24px; } .brand { color:var(--ink); font:700 16px Arial,sans-serif; text-decoration:none; white-space:nowrap; } nav { display:flex; overflow-x:auto; } nav a { display:inline-flex; align-items:center; min-height:52px; padding:0 12px; color:var(--muted); border-bottom:3px solid transparent; font:700 14px Arial,sans-serif; text-decoration:none; white-space:nowrap; } nav a:hover,nav a[aria-current=page] { color:var(--teal); background:var(--canvas); } nav a[aria-current=page] { border-color:var(--teal); }
    main { padding:48px 0 72px; } .eyebrow { margin:0 0 6px; color:var(--teal); font:700 12px Arial,sans-serif; letter-spacing:.08em; text-transform:uppercase; } h1 { margin:0 0 8px; font-size:clamp(32px,4vw,48px); line-height:1.1; } h2 { margin:0 0 8px; font-size:22px; line-height:1.25; } .intro { max-width:680px; margin:0; color:var(--muted); } .heading { display:flex; align-items:end; justify-content:space-between; gap:24px; margin-bottom:32px; }.panel { padding:var(--space); border:1px solid var(--line); border-radius:8px; background:var(--surface); box-shadow:0 2px 8px rgb(19 34 53 / 8%); } .grid { display:grid; grid-template-columns:3fr 2fr; gap:24px; } .button { display:inline-flex; align-items:center; justify-content:center; min-height:44px; padding:10px 16px; border:1px solid var(--teal); border-radius:4px; color:#fff; background:var(--teal); font:700 14px Arial,sans-serif; text-decoration:none; cursor:pointer; } .button:hover { background:var(--teal-dark); border-color:var(--teal-dark); } .button.secondary { color:var(--teal); background:#fff; } .button:disabled { opacity:.45; cursor:not-allowed; } :focus-visible { outline:3px solid var(--ink); outline-offset:3px; }
    table { width:100%; border-collapse:collapse; } th,td { padding:16px; border-bottom:1px solid var(--line); text-align:left; } th { color:var(--muted); background:#edf2f2; font:700 12px Arial,sans-serif; letter-spacing:.06em; text-transform:uppercase; } tr:last-child td { border:0; } .table-wrap { overflow-x:auto; } .status { display:inline-flex; padding:4px 8px; border-radius:4px; font:700 13px Arial,sans-serif; } .warning { color:var(--amber); background:var(--amber-soft); }.danger { color:var(--red); background:var(--red-soft); }.success { color:var(--teal-dark); background:var(--teal-soft); }.notice { padding:16px; border-left:4px solid var(--amber); background:var(--amber-soft); }.metric-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin-bottom:24px; }.metric { padding:20px; border:1px solid var(--line); background:var(--surface); }.metric p { margin:8px 0 0; font:700 36px Arial,sans-serif; color:var(--teal); } label { display:block; margin:16px 0 6px; font:700 14px Arial,sans-serif; } input,textarea { width:100%; min-height:44px; padding:10px; border:1px solid var(--line); border-radius:4px; color:var(--ink); background:#fff; } textarea { min-height:220px; resize:vertical; }.actions { display:flex; flex-wrap:wrap; gap:12px; margin-top:20px; }.state { padding:48px 24px; text-align:center; }.state p { color:var(--muted); }.error { color:var(--red); } .card { margin-top:16px; padding:20px; border:1px solid var(--line); border-radius:8px; background:#fff; }.small { color:var(--muted); font:14px Arial,sans-serif; }
    @media(max-width:767px) { .bar,.heading { align-items:flex-start; flex-direction:column; gap:0; }.bar { padding-top:16px; }.heading .button { width:100%; margin-top:24px; }.grid,.metric-grid { grid-template-columns:1fr; } main { padding-top:32px; } }
  </style>
</head>
<body>
  <a class="skip" href="#main">Skip to main content</a><header><div class="bar"><a class="brand" href="/">CMS-2567 Compliance Assistant</a><nav aria-label="Primary navigation"><a href="/">Queue</a><a href="/upload">Upload</a><a href="/governance">Governance</a><a href="/outcomes">Outcomes</a></nav></div></header>
  <main id="main" tabindex="-1"></main>
  <script>
    const main = document.querySelector('main'); const screen = location.pathname.slice(1) || 'queue'; const recordId = new URLSearchParams(location.search).get('record') || 'riverside-2026';
    const routes = { queue:'Queue', upload:'Upload', 'extraction-review':'Extraction review', deficiencies:'Deficiencies', 'poc-draft':'POC drafts', 'poc-review':'POC review', export:'Approved output', governance:'Governance', outcomes:'Outcomes', 'upload-error':'Upload error' };
    document.querySelectorAll('nav a').forEach(a => { if (a.getAttribute('href').slice(1) === screen || (screen === 'queue' && a.getAttribute('href') === '/')) a.setAttribute('aria-current','page'); });
    const request = async (url, options) => { const response = await fetch(url, options); if (!response.ok) throw new Error((await response.json()).detail || 'Request failed.'); return response.json(); };
    const layout = (eyebrow,title,content) => { main.innerHTML = `<p class="eyebrow">${eyebrow}</p><h1>${title}</h1><div id="content">${content}</div>`; };
    async function showQueue(){ layout('Worklist','Processing queue','<section class="panel state">Loading records requiring review.</section>'); const data=await request('/api/queue'); const rows=data.records.map(r=>`<tr><td><strong>${r.provider}</strong></td><td>${r.format}</td><td><span class="status ${r.destination==='extraction-review'?'warning':'danger'}">${r.stage}</span></td><td><a class="button secondary" href="/${r.destination}?record=${r.id}">${r.action}</a></td></tr>`).join(''); document.querySelector('#content').innerHTML=`<section class="panel"><h2>Records requiring review</h2><p class="small">${data.records.length} records requiring review</p><div class="table-wrap"><table><thead><tr><th>Provider</th><th>Format</th><th>Stage</th><th>Action</th></tr></thead><tbody>${rows}</tbody></table></div><div class="actions"><a class="button" href="/upload">Start new record</a></div></section>`; }
    async function showUpload(){ layout('New processing record','Upload CMS Survey Form','<section class="panel"><form id="upload"><label for="provider">Provider name</label><input id="provider" required><label for="format">Survey format</label><select id="format"><option>Format 1</option><option>Format 2</option><option>Open-source format</option></select><div class="actions"><button class="button">Create record</button></div><p id="message" role="status"></p></form></section>'); document.querySelector('#upload').onsubmit=async e=>{e.preventDefault(); try { const result=await request('/api/records',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({provider:provider.value,format:format.value})}); location.href=`/extraction-review?record=${result.record_id}`;} catch(error){message.textContent=error.message;}}; }
    async function showFields(){ const [record,data]=await Promise.all([request(`/api/records/${recordId}`),request(`/api/records/${recordId}/fields`)]); layout(`${record.provider} / ${record.format}`,'Review Extracted Fields',`<div class="grid"><section class="panel"><h2>Draft values</h2><form id="fields">${data.fields.map(f=>`<label for="${f.name}">${f.name}</label><input id="${f.name}" value="${f.value}" ${f.verified?'readonly':''}>`).join('')}<div class="actions"><button class="button">Verify fields and review deficiencies</button></div></form></section><aside class="panel"><h2>Source evidence</h2><div class="notice">Verify each value against the source document before continuing.</div></aside></div>`); document.querySelector('#fields').onsubmit=async e=>{e.preventDefault(); try {for(const field of data.fields) await request(`/api/records/${recordId}/fields/${encodeURIComponent(field.name)}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({value:document.getElementById(field.name).value})}); location.href=`/deficiencies?record=${recordId}`;} catch(error){alert(error.message);}}; }
    async function showDeficiencies(){ const data=await request(`/api/records/${recordId}/deficiencies`); layout('Deficiency review','Confirm Deficiencies',`<section class="panel"><h2>Identified survey findings</h2>${data.deficiencies.length?data.deficiencies.map(d=>`<article class="card"><h2>${d.tag}: ${d.title}</h2><p class="small">Boundary confidence: ${d.confidence}</p></article>`).join(''):'<div class="state"><h2>No deficiencies identified</h2><p>Return to extraction review to correct the source fields.</p></div>'}<div class="actions"><a class="button" href="/poc-draft?record=${recordId}">Confirm deficiencies and generate POC drafts</a></div></section>`); }
    async function showPocDraft(){ const data=await request(`/api/records/${recordId}/poc`); layout('Riverside Nursing Center / Deficiency F689','CMS-Grounded POC Draft',`<div class="grid"><section class="panel"><form id="poc"><label for="poc-text">Plan of correction</label><textarea id="poc-text" required>${data.content}</textarea><div class="actions"><button class="button">Save draft and begin POC review</button></div></form></section><aside class="panel"><h2>CMS grounding</h2><p>Approved sources are attached to this review.</p></aside></div>`); document.querySelector('#poc').onsubmit=async e=>{e.preventDefault();try{await request(`/api/records/${recordId}/poc`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({value:document.querySelector('#poc-text').value})});location.href=`/poc-review?record=${recordId}`;}catch(error){alert(error.message)}}; }
    async function showPocReview(){ const data=await request(`/api/records/${recordId}/poc`); layout('Deficiency F689 / Review required','Review and Approve POC',`<div class="grid"><section class="panel"><label for="review-text">Staff-reviewed POC</label><textarea id="review-text">${data.content}</textarea><p class="small">Origin: AI draft with staff edits tracked in review history.</p><div class="actions"><button class="button" id="approve">Approve POC for controlled export</button><a class="button secondary" href="/poc-draft?record=${recordId}">Return for correction</a></div><p id="approval" role="status"></p></section><aside class="panel"><h2>Approval checks</h2><p>Required POC elements and supporting CMS sources must be complete.</p></aside></div>`); document.querySelector('#approve').onclick=async()=>{try{await request(`/api/records/${recordId}/poc/approve`,{method:'POST'});location.href=`/export?record=${recordId}`;}catch(error){approval.textContent=error.message;approval.className='error';}}; }
    async function showExport(){ const data=await request(`/api/records/${recordId}/poc`); layout('Riverside Nursing Center / F689','Approved Output',`<section class="panel"><h2>POC is ${data.state==='approved'?'approved for use':'not approved'}</h2><div class="notice"><p>Source set: current approved CMS guidance.</p><p>Export remains unavailable until every required field and POC is approved.</p></div><div class="actions"><a class="button" href="/">Return to processing queue</a><a class="button secondary" href="/poc-review?record=${recordId}">View approval history</a></div></section>`); }
    async function showGovernance(){ const data=await request('/api/governance/sources'); layout('Authorized governance workspace','CMS Knowledge Sources and POC Rubric',`<section class="panel"><h2>Approved source set</h2><div class="table-wrap"><table><thead><tr><th>Source</th><th>Effective date</th><th>Status</th></tr></thead><tbody>${data.sources.map(s=>`<tr><td>${s.name}</td><td>${s.effective_date}</td><td><span class="status ${s.status==='Approved'?'success':'warning'}">${s.status}</span></td></tr>`).join('')}</tbody></table></div></section><section class="panel" style="margin-top:24px"><h2>Add source for review</h2><form id="source"><label for="source-name">Source name</label><input id="source-name" required><label for="effective-date">Effective date</label><input id="effective-date" type="date" required><div class="actions"><button class="button">Save as pending review</button></div><p id="source-message" role="status"></p></form></section>`); document.querySelector('#source').onsubmit=async e=>{e.preventDefault();try{await request('/api/governance/sources',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:sourceName.value,effective_date:effectiveDate.value})});location.reload();}catch(error){sourceMessage.textContent=error.message;}}; const sourceName=document.querySelector('#source-name'),effectiveDate=document.querySelector('#effective-date'),sourceMessage=document.querySelector('#source-message'); }
    async function showOutcomes(){ const data=await request('/api/outcomes'); layout('Pilot validation','Processing Outcomes',`<div class="metric-grid">${data.metrics.map(m=>`<section class="metric"><h2>${m.name}</h2><p>${m.value}</p></section>`).join('')}</div><section class="panel"><h2>Representative sample coverage</h2><div class="table-wrap"><table><thead><tr><th>Format</th><th>Samples</th><th>Baseline time</th><th>Approval rate</th></tr></thead><tbody>${data.coverage.map(c=>`<tr><td>${c.format}</td><td>${c.samples}</td><td>${c.baseline}</td><td>${c.approval_rate}</td></tr>`).join('')}</tbody></table></div></section>`); }
    const views={queue:showQueue,upload:showUpload,'extraction-review':showFields,deficiencies:showDeficiencies,'poc-draft':showPocDraft,'poc-review':showPocReview,export:showExport,governance:showGovernance,outcomes:showOutcomes,'upload-error':()=>layout('Upload error','Document cannot be processed','<section class="panel state"><h2>Choose another document</h2><p>The file is unreadable or unsupported. No approved record was created.</p><a class="button" href="/upload">Return to upload</a></section>')};
    views[screen]().catch(error=>layout('Service unavailable','We could not load this screen',`<section class="panel state"><p class="error">${error.message}</p><a class="button" href="/">Return to processing queue</a></section>`));
  </script>
</body>
</html>
